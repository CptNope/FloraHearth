<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FloraHearth - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Mitigates 404 on direct navigation or page refresh
      const l = window.location;
      sessionStorage.redirect = l.href;
      // If deployed under username.github.io/repo, keep 1 path segment; if custom domain, keep 0
      const isGitHubPagesProject = l.hostname.endsWith('github.io') && l.pathname.split('/').filter(Boolean).length >= 1;
      const pathSegmentsToKeep = isGitHubPagesProject ? 1 : 0;
      const basePath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath);
    </script>
  </head>
  <body>
    <p>Redirecting to FloraHearth application...</p>
  </body>
</html>
